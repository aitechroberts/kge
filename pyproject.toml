[project]
name = "kge"
version = "0.1.0"
description = "Knowledge Graph Extraction system using Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "KGE Team", email = "kge@example.com"}
]
keywords = ["knowledge-graph", "information-extraction", "nlp", "llm", "graph-database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "accelerate==1.10.0",
    "apscheduler>=3.11.0",
    "azure-identity==1.24.0",
    "azure-storage-blob==12.26.0",
    "dspy-ai==2.6.27",
    "duckdb==1.2.0",
    "fastapi>=0.104.0",
    "huggingface-hub>=0.34.4",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "kg-gen>=0.1.6",
    "kuzu==0.11.1",
    "neo4j==5.28.2",
    "numpy<2.0",
    "openai>=1.90.0",
    "outlines>=0.0.41",
    "pandas>=2.3.1",
    "prefect==3.4.12",
    "prefect-azure==0.4.5",
    "prefect-docker==0.6.6",
    "pyarrow>=21.0.0",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "pytest>=7.0.0",
    "requests>=2.28.0",
    "tokenizers==0.21.4",
    "transformers==4.55.0",
    "uvicorn>=0.24.0",
    "vllm==0.10.0",
    "xgrammar>=0.1.21",
]

